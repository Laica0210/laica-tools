    <main class="sans-bordure"> 
         <h2> Calculs comptables </h2>

         <section>
            <h3> Conversion HT/TTC </h3>
            <div>
               <label for="ht"> Montant HT : </label>
               <input type="number" id="ht">
            </div>
            <div>
               <label for="ttc"> Montant TTC : </label>
               <input type="number" id="ttc"> 
            </div>
            <!-- ajout du choix de taux -->
           <label for="taux"> Taux de TVA </label>
           <select id="taux">
              <option value="20"> 20 % </option>
              <option value="10" > 10 % </option>
              <option value="5.5" > 5,5 %</option>
              <option value="2.1"> 2,1  % </option> 
           </select>
           <button type="button" id="btn-conversion"> Calculer </button>
           <p id="resultat-conversion"> R&eacute;sultat: </p>        
         </section>
           <!--fin du premier block -->  
           
         <section>
            <h3> Calcul escompte </h3>
            <div>
              <label for="brut-ht"> Brut HT: </label>
              <input type="number"  id="brut-ht">
            </div>
            <div>
               <label for="tx"> taux d'escompte % </label>
               <input type="number"  id="tx" >
            </div>
            <button type="button" id="btn-escompte"> Calculer </button>
            <p id="resultat-escompte"> R&eacute;sultat : </p>
         </section> 
          <!--fin du deuxieme bloc-->
          
         <section>
          <h3> Net commercial/ Net financier </h3>
          <div>
            <label for="mtn-brut"> Montant Brut </label>
            <input type="number" id="mtn-brut">
          </div>
          <div>
            <label for="rrr"> RRR (remise,rabais,ristourne) %</label>
            <input type="number"  id="rrr" >
          </div>
          <div>
            <label for="escompte"> Taux d'escompte % </label>
            <input type="number"  id="escompte">
          </div>
          <div>
           <label for="tv"> Taux de TVA </label>
           <select id="tv">
              <option value="20"> 20 % </option>
              <option value="10" > 10 % </option>
              <option value="5.5" > 5,5 %</option>
              <option value="2.1"> 2,1  % </option> 
           </select>
          </div>
          <button  type="button" id="btn-net"> Calculer </button>
          <p id="resultat-co"> Net Commercial: </p>
          <p id="resultat-fi"> Net Financier : </p>
          <p id="re-netapayer"> Net &agrave; payer: </p>

         </section>
